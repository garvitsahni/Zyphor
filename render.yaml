services:
  - type: web
    name: zyphor-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: USE_MOCK_DB
        value: "false"
      - fromGroup: zyphor-secrets
